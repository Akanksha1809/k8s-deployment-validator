# INTENTIONALLY BAD: compliant except for one runtime trap.
# - readOnlyRootFilesystem: true, but the only volume is mounted readOnly,
#   so nginx cannot write its temp/cache files and crashes at startup.
#   Fix: mount an emptyDir at /tmp (see examples/good/nginx.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "1.27.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: static-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: site-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: site-config
          configMap:
            name: static-site-config
