name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Good examples must pass (strict)
        run: k8s-validator examples/good --strict

      - name: Bad examples must fail
        run: |
          set +e
          k8s-validator examples/bad
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::Expected exit code 1 for examples/bad, got $code"
            exit 1
          fi
          echo "examples/bad correctly rejected"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t k8s-deployment-validator:ci .

      - name: Validate good examples inside container
        run: docker run --rm -v "$PWD/examples/good:/manifests:ro" k8s-deployment-validator:ci --strict
